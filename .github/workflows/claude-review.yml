# Added automatically by sacha-riccardo-leone/claude-review-setup
name: Claude review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

jobs:
  review:
    # Bots (Dependabot…) get no secrets: skip them instead of failing.
    if: github.event.pull_request.draft == false && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Report only real problems: bugs, security holes,
            missing error handling, things that break under real use. Skip style nits.
            Put each problem as an inline comment on its line, then post one short summary comment.
            If nothing is wrong, post one line saying so.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
